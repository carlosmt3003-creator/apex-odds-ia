
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07120F">
    <meta name="application-name" content="FOOTBALL BLITZ TOP CARD">
    <meta name="apple-mobile-web-app-title" content="FOOTBALL BLITZ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>FOOTBALL BLITZ TOP CARD</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="Ícone Futurista Football Blitz.png">
<link rel="apple-touch-icon" href="Ícone Futurista Football Blitz.png">
<link rel="manifest" href="manifest.json">
</head>


<body>
<div class="app">

    <header class="header">
        <div class="brand">
            <div>
                <h1>FOOTBALL BLITZ TOP CARD</h1>
                <span>PAINEL DE ANÁLISE</span>
            </div>
        </div>
        <button class="icon-button" id="settingsButton">⚙</button>
    </header>

    <main>

        <section id="inicio" class="section">
            <div class="section-heading">
                <h2>ÁREA DO JOGO</h2>
                <button id="toggleGame">Expandir</button>
            </div>

            <div class="game-card" id="gameCard">
                <iframe id="gameFrame" src="about:blank"
                    title="Área configurável do jogo"></iframe>
                <p id="gamePlaceholder">Configure o endereço do iframe nas configurações.</p>
            </div>
        </section>

        <div class="analysis-grid">

            <section id="cores" class="panel">
                <div class="panel-header">
                    <div>
                        <span class="eyebrow">ANÁLISE 01</span>
                        <h2>ANÁLISE DE CORES</h2>
                    </div>
                    <span class="status-dot"></span>
                </div>

                <div class="result-box">
                    <span class="result-label">RESULTADO</span>
                    <h3 id="colorResult">AGUARDANDO</h3>
                    <p id="colorProtection">PROTEGER EMPATE ATÉ G1</p>
                    <strong id="colorPercentage">--%</strong>
                </div>

                <div class="progress-track">
                    <div id="colorProgress" class="progress-fill"></div>
                </div>

                <p id="colorStatus" class="status-text">Sistema disponível</p>

                <button class="primary-button" id="colorButton">
                    ANALISAR CORES
                </button>

                

                <div class="countdown" id="colorCountdown"></div>
            </section>

        </div>

        <section id="configuracoes" class="panel settings-panel">
            <div class="panel-header">
                <div>
                    <span class="eyebrow">PERSONALIZAÇÃO</span>
                    <h2>CONFIGURAÇÕES</h2>
                </div>
            </div>

            <label class="setting-row">
                <span>Tema escuro</span>
                <input type="checkbox" id="themeToggle" checked>
            </label>

            <label class="setting-row">
                <span>Sons do aplicativo</span>
                <input type="checkbox" id="soundToggle">
            </label>

            <label class="setting-row iframe-setting">
                <span>Endereço do iframe</span>
                <input type="url" id="iframeUrl"
                    placeholder="https://exemplo.com">
            </label>

            <button class="primary-button" id="saveSettings">
                SALVAR CONFIGURAÇÕES
            </button>
        </section>

    </main>

    <nav class="bottom-nav">
        <a href="#inicio"><span>⌂</span>Início</a>
        <a href="#cores"><span>◉</span>Cores</a>
        <a href="#duplos"><span>⚄</span>Duplos</a>
        <a href="#triplos"><span>◷</span>Triplos</a>
        <a href="#configuracoes"><span>⚙</span>Ajustes</a>
    </nav>

</div>

<script src="script.js"></script>
</body>
</html>
